services:
  postgres:
    image: postgres:16
    container_name: axum_postgres
    ports:
      - "127.0.0.1:6500:5432"
    volumes:
      - axum_postgresDB:/var/lib/postgresql/data
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: wavforge
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/postgres
      STORAGE_DIR: /var/lib/app
    ports:
      - "3000:3000"
    volumes:
      - wavforge_data:/var/lib/app

  pgAdmin:
    image: dpage/pgadmin4
    container_name: pgAdmin
    env_file:
      - ./.env
    ports:
      - "127.0.0.1:5050:80"

volumes:
  axum_postgresDB:
  wavforge_data:
