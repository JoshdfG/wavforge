[package]
name = "wavforge"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7.9", features = ["multipart"] }
dotenv = "0.15.0"
serde_json = "1.0.95"
sqlx = { version = "0.8.2", features = ["runtime-tokio-native-tls", "postgres", "uuid", "migrate"] }
tokio = { version = "1.27.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.5.0", features = ["cors", "fs"] }
uuid = { version = "1.3.0", features = ["serde", "v4"] }
symphonia = { version = "0.5", features = ["isomp4", "aac", "alac", "mp3"] }
hound = "3"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[profile.dev.package."*"]
opt-level = 3
